<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | RK Decoration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="logo">🎈 <span data-cfg="businessName">RK Decoration</span> <small>Admin</small></a>
      <button id="logoutBtn" class="btn btn-sm btn-outline hidden">Logout</button>
    </div>
  </header>

  <section id="loginView" class="section hidden">
    <div class="container narrow">
      <form id="loginForm" class="card form">
        <h2>Admin Login</h2>
        <label>Email<input name="email" type="email" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn btn-gold btn-block" type="submit">Login</button>
        <p id="loginError" class="field-msg err"></p>
        <p id="demoHint" class="muted small hidden">Demo mode: use any email with password <strong>admin123</strong>.</p>
      </form>
    </div>
  </section>

  <section id="dashView" class="section hidden">
    <div class="container">
      <div class="stats" id="stats"></div>

      <div class="card">
        <div class="toolbar">
          <h2>Bookings</h2>
          <input id="search" placeholder="Search name, phone, ID...">
          <select id="statusFilter">
            <option value="">All status</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <select id="whenFilter">
            <option value="upcoming">Upcoming</option>
            <option value="today">Today</option>
            <option value="past">Past</option>
            <option value="all">All dates</option>
          </select>
          <button id="refreshBtn" class="btn btn-sm btn-outline">Refresh</button>
          <button id="exportBtn" class="btn btn-sm">Export CSV</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Event</th><th>Customer</th><th>Details</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="bookingRows"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>Block Dates (holidays / fully busy)</h2>
        <form id="blockForm" class="row">
          <input name="day" type="date" required>
          <input name="reason" placeholder="Reason (optional)" maxlength="100">
          <button class="btn btn-sm" type="submit">Block date</button>
        </form>
        <ul id="blockedList" class="blocked-list"></ul>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
